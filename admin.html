<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Shatakshi QR Print</title><style>body{font-family:Arial,'Noto Sans Devanagari',sans-serif;background:#f4f5f7;margin:0;padding:18px;color:#222}.wrap{max-width:1100px;margin:auto}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}input,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px}button{background:#f97316;color:#fff;border:0;cursor:pointer;margin:3px}.row{display:flex;gap:8px;flex-wrap:wrap}.order{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0;overflow-wrap:anywhere}.muted{color:#666;font-size:13px}.err{color:#b91c1c}.ok{color:#166534}@media(max-width:600px){body{padding:8px}}</style></head><body><main class="wrap"><h1>Shatakshi Graphics & Online</h1><h2>QR Print Admin Panel</h2><section class="card"><p>Admin पासवर्ड डालें। यह लोकल टेस्ट पैनल है। इंटरनेट पर खोलने से पहले HTTPS और मजबूत सुरक्षा आवश्यक है।</p><div class="row"><input id="pw" type="password" placeholder="ADMIN_PASSWORD" style="flex:1;min-width:220px"><button id="load">ऑर्डर देखें</button></div><p id="msg" class="muted"></p></section><section class="card"><h3>ऑर्डर सूची</h3><div id="orders">पासवर्ड डालकर ऑर्डर लोड करें।</div></section></main><script>const pw=document.getElementById('pw'),msg=document.getElementById('msg'),orders=document.getElementById('orders');async function api(url,method='GET'){const r=await fetch(url,{method,headers:{'x-admin-password':pw.value}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){msg.textContent='लोड हो रहा है...';try{const data=await api('/api/admin/orders');orders.innerHTML='';if(!data.length){orders.textContent='अभी कोई ऑर्डर नहीं है।';}data.slice().reverse().forEach(o=>{const el=document.createElement('article');el.className='order';const title=document.createElement('h3');title.textContent=o.id+' · ₹'+(o.total??'रेट बाकी');el.append(title);const info=document.createElement('p');info.textContent=`${o.customerName||'नाम नहीं'} | ${o.phone||'फोन नहीं'} | ${o.originalName} | ${o.pageCount} पेज × ${o.copies} कॉपी | ${o.paperSize} | ${o.kind==='colour'?'Colour':'B&W'} | पेमेंट: ${o.paymentMethod||'cash'} | स्थिति: ${o.paymentStatus} / ${o.printStatus}`;el.append(info);const btn=document.createElement('button');btn.textContent=o.paymentMethod==='upi'?'UPI मैनुअल पुष्टि':'कैश प्राप्त';btn.onclick=async()=>{if(!confirm('क्या आपने ग्राहक से वास्तविक भुगतान प्राप्त/बैंक में सत्यापित किया है?'))return;try{await api('/api/admin/orders/'+encodeURIComponent(o.id)+(o.paymentMethod==='upi'?'/confirm-upi-manual':'/approve-cash'),'POST');msg.textContent='भुगतान पुष्टि दर्ज हुई। यह अभी प्रिंट नहीं निकालता; प्रिंट एजेंट जोड़ना बाकी है।';load()}catch(e){msg.textContent=e.message}};el.append(btn);orders.append(el)});msg.textContent='ऑर्डर लोड हो गए। UPI बटन केवल मैनुअल पुष्टि है, ऑटो बैंक सत्यापन नहीं।'}catch(e){msg.textContent=e.message;msg.className='err'}}document.getElementById('load').onclick=load;</script></body></html>
